x-tools-image: &tools-image
  build: .
  image: igvf-cvfg-pillar-project-tools:local

x-r-tools-image: &r-tools-image
  build:
    context: .
    dockerfile: Dockerfile.r
  image: igvf-cvfg-pillar-project-r-tools:local

services:
  # Shares the VARIANT_DATA_DIR env var with the variant-annotation pipeline
  # (see scripts/run_variant_annotation_pipeline.sh) so both containers read
  # and write the same staged data directory as /work.
  flag-variants:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.flag_variants"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Shares the VARIANT_DATA_DIR staging mount with flag-variants above, since
  # it also reads/writes staged pipeline data (cvfg_variants.*.tsv) rather
  # than committed repo files.
  recalculate-clingen-classification:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.recalculate_clingen_classification"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Shares the VARIANT_DATA_DIR staging mount with flag-variants and
  # recalculate-clingen-classification above, since it also reads/writes
  # staged pipeline data (cvfg_variants.*.tsv) rather than committed repo
  # files.
  add-mavedb-active-calibration-columns:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.add_mavedb_active_calibration_columns"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Shares the VARIANT_DATA_DIR staging mount with the other steps above, for
  # the same reason: it reads/writes staged pipeline data (cvfg_variants.*.tsv)
  # rather than committed repo files. Replaces step_14's old in-script `awk`
  # pass, which read the file line-by-line and silently corrupted the
  # derived score_set_urn for any row whose mavedb_mapping_error spans
  # multiple physical lines (see docs/derive_score_set_urn.md).
  derive-score-set-urn:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.derive_score_set_urn"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Shares the VARIANT_DATA_DIR staging mount with the other steps above, for
  # the same reason: it reads/writes staged pipeline data (cvfg_variants.*.tsv)
  # rather than committed repo files.
  postprocess-mavedb-functional-classifications:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.postprocess_mavedb_functional_classifications"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Shares the VARIANT_DATA_DIR staging mount with the other steps above, for
  # the same reason: it reads/writes staged pipeline data (cvfg_variants.*.tsv)
  # rather than committed repo files. Step 20's code-translation half.
  # Replaces step_20's old in-script `awk` pass, which read the file
  # line-by-line and silently corrupted assayed_variant_level (and every
  # other column) for any row whose value spans multiple physical lines --
  # same underlying bug, and same fix, as derive-score-set-urn above.
  translate-assayed-variant-level:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.translate_assayed_variant_level"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Shares the VARIANT_DATA_DIR staging mount with the other steps above, for
  # the same reason: it reads/writes staged pipeline data (cvfg_variants.*.tsv)
  # rather than committed repo files. Step 20's rna_score-merge half.
  merge-rna-score-columns:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.merge_rna_score_columns"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Reads the committed data/input/reference/extended_ensembl_consequence.csv.gz
  # (this project's own bind mount) plus staged cvfg_variants.*.tsv (the
  # VARIANT_DATA_DIR /work mount), so it needs both, same as flag-variants
  # and recalculate-clingen-classification above.
  annotate-simplified-consequence:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.annotate_simplified_consequence"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
      - ${VARIANT_DATA_DIR:-./data}:/work

  # Reads data/input/predictors/ (committed CVFG-specific source files) and
  # writes revel_training_variants.tsv / mutpred2_training_variants.tsv
  # directly into data/intermediate/variant_annotation/data/ -- a preparatory
  # step for the variant-annotation pipeline's Step 13. Both paths are fixed
  # under this project's own tree (unlike flag-variants/
  # recalculate-clingen-classification's staged cvfg_variants files), so like
  # mave-dataset-stats and load-excalibr-calibrations this only needs the
  # repo bind mount, not the VARIANT_DATA_DIR /work mount those two use.
  build-training-variant-files:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.build_training_variant_files"]
    command: []
    volumes:
      - .:/usr/src/app

  # Reads only locally-generated data/output/maves/ and
  # data/output/supplementary_data/ files, so it doesn't need the /work
  # staging mount that flag-variants uses. Unlike flag-variants, every CLI
  # arg is optional (defaults point at data/output/), so the default command
  # is empty -- not --help -- so a bare `docker compose run mave-dataset-stats`
  # computes stats immediately.
  mave-dataset-stats:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.mave_dataset_stats"]
    command: []
    volumes:
      - .:/usr/src/app

  # Reads the locally-generated data/input/mave_calibration/excalibr/ JSON
  # files and overwrites the ExCALIBR_calibrations sheet of the
  # locally-generated data/output/supplementary_data/Supplementary_Data_4.xlsx
  # in place, so like mave-dataset-stats it only needs the repo bind mount --
  # no /work staging mount.
  load-excalibr-calibrations:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.load_excalibr_calibrations"]
    command: []
    volumes:
      - .:/usr/src/app

  # Reads the locally-generated data/output/mave_calibration/
  # OddsPath_calibrations.csv.gz and overwrites the OddsPath_calibrations
  # sheet of the locally-generated data/output/supplementary_data/
  # Supplementary_Data_4.xlsx in place -- the OddsPath counterpart to
  # load-excalibr-calibrations above, same reasoning for only needing the
  # repo bind mount.
  load-oddspath-calibrations:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.load_oddspath_calibrations"]
    command: []
    volumes:
      - .:/usr/src/app

  # Builds data/output/reclassification/integrated_variant_effect_biobank_input_data.tsv.gz
  # from Variant_Classification_analysis.ipynb's own checkpoint -- Stage 2's
  # final step. Reads/writes only this repo's own tree, so like
  # mave-dataset-stats it only needs the repo bind mount. checkpoint_file's
  # default (DEFAULT_CHECKPOINT_FILE) makes a bare invocation useful.
  build-variant-reclassification-dataset:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.build_variant_reclassification_dataset"]
    command: []
    volumes:
      - .:/usr/src/app

  # Generic runner for the Stage 2 analysis notebooks
  # (notebooks/analysis/OddsPath_calculations.ipynb,
  # OddsPath_classifications.ipynb, Variant_Classification_analysis.ipynb)
  # and the Stage 3 Python figure notebooks (notebooks/figures/figure_2/*.ipynb,
  # figure_4/figure4.ipynb, extended_data_figure_5/Extended_Data_Figure_5.ipynb).
  # Unlike the R figure scripts below, `jupyter nbconvert --execute`'s
  # ExecutePreprocessor already defaults the *kernel's* cwd to the notebook's
  # own directory regardless of the invoking shell's cwd, so -- unlike
  # r-figures -- no --workdir override is needed per invocation; just pass
  # the repo-relative notebook path, e.g.:
  #   docker compose run --rm analysis-notebooks --to notebook --execute \
  #     --ExecutePreprocessor.kernel_name=python3 \
  #     --ExecutePreprocessor.timeout=600 \
  #     --output executed_OddsPath_calculations.ipynb \
  #     notebooks/analysis/OddsPath_calculations.ipynb
  # kernel_name is python3 (ipykernel's default), not a registered
  # project-specific kernel -- nothing in the repo depends on a particular
  # kernel name, only on the packages the "notebooks" Poetry extra installs.
  analysis-notebooks:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["jupyter", "nbconvert"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app

  # Figure 3's data-prep script. All CLI args have defaults pointing at
  # committed/generated repo files, so like mave-dataset-stats it only needs
  # the repo bind mount and a bare invocation is useful.
  build-figure3-data:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.build_figure3_data"]
    command: []
    volumes:
      - .:/usr/src/app

  # Figure 4's data-prep script. --cached-json has no usable default (three
  # sub-panels can't be regenerated from scratch -- see docs/figures.md), so
  # a bare invocation isn't useful; default to --help like flag-variants.
  build-figure4-data:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.build_figure4_data"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app

  # Extended Data Figure 7alt (candidate replacement for Fig. 7). All CLI
  # args have defaults, so a bare invocation is useful.
  make-extended-data-figure-7alt:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.make_extended_data_figure_7alt"]
    command: []
    volumes:
      - .:/usr/src/app

  # Extended Data Figure 7alt, OddsPath-calibrated variant -- same reasoning
  # as make-extended-data-figure-7alt above.
  make-extended-data-figure-7alt-op:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.make_extended_data_figure_7alt_op"]
    command: []
    volumes:
      - .:/usr/src/app

  # Extended Data Figure 10 (functional-vs-predictor evidence ablation).
  # --calibrated-figure has no default, and the figure is the whole point of
  # running this, so default to --help like flag-variants/build-figure4-data
  # rather than a silent no-op.
  ablation-variant-reclassification:
    <<: *tools-image
    profiles:
      - tools
    entrypoint: ["python", "-m", "src.ablation_variant_reclassification"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app

  # Generic runner for the manuscript's R figure scripts
  # (notebooks/figures/**/*.R, notebooks/figures/**/*.Rmd). These scripts
  # read/write relative filenames (e.g.
  # `read_csv("../../../data/input/biobank/IGVFFI3804AVJR.csv.gz")`),
  # assuming cwd is the script's own directory, so override --workdir per
  # invocation:
  #   docker compose run --rm -w /usr/src/app/notebooks/figures/figure_5_6 \
  #     r-figures Figure_6b.R
  r-figures:
    <<: *r-tools-image
    profiles:
      - tools
    entrypoint: ["Rscript"]
    command: ["--help"]
    volumes:
      - .:/usr/src/app
